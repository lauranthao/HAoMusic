# HAo Music — Bitrise workflow
#
# Fallback build check when GitHub Actions macOS runners have no capacity.
# Unsigned simulator build only (compile check); signed IPA packaging comes
# later, at release time. Branch: master. Stack: Xcode 26.2.
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
trigger_map: []
workflows:
  primary:
    meta:
      bitrise.io:
        stack: osx-xcode-26.2.x
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Build for simulator (unsigned)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            xcodebuild -project HAoMusic.xcodeproj \
              -target HAoMusic \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
